services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: arx-tessera-backend
    restart: unless-stopped
    ports:
      - "8082:8082"
    volumes:
      - ./server.js:/app/server.js:ro
      - ./api:/app/api:ro
      - ./lib:/app/lib:ro
    environment:
      - NODE_ENV=production
      - BACKEND_PORT=8082
      - CONTACT_RECIPIENT_EMAIL=${CONTACT_RECIPIENT_EMAIL:-contact@najialess.io}
      - EMAIL_FROM=${EMAIL_FROM:-Arx Tessera Dispatch <onboarding@resend.dev>}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - INBOUND_WEBHOOK_SECRET=${INBOUND_WEBHOOK_SECRET:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3002,http://127.0.0.1:3002,https://najialess.io,https://www.najialess.io}
    networks:
      - arx-net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: arx-tessera-frontend
    restart: unless-stopped
    ports:
      - "3002:3002"
    volumes:
      - ./:/usr/share/nginx/html:ro
    depends_on:
      - backend
    networks:
      - arx-net

networks:
  arx-net:
    driver: bridge

