<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 550" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22593c"/>
      <stop offset="100%" stop-color="#163f2a"/>
    </linearGradient>

    <linearGradient id="crimsonAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e52d30"/>
      <stop offset="100%" stop-color="#cf2224"/>
    </linearGradient>

    <linearGradient id="greenNodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d7751"/>
      <stop offset="100%" stop-color="#22593c"/>
    </linearGradient>
  </defs>

  <!-- Outer Shield Crest -->
  <path d="M250 25 L450 90 V280 C450 395 355 480 250 515 C145 480 50 395 50 280 V90 L250 25 Z" 
        fill="none" 
        stroke="#22593c" 
        stroke-width="18" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Inner Architectural Arch Border -->
  <path d="M250 65 L410 120 V270 C410 365 335 440 250 470 C165 440 90 365 90 270 V120 L250 65 Z" 
        fill="none" 
        stroke="#22593c" 
        stroke-width="7" 
        stroke-linecap="round"/>

  <!-- Stylized Geometric "A" Ribbon Overlap -->
  <path d="M250 90 L360 330 H310 L275 250 H225 L190 330 H140 L250 90 Z" 
        fill="url(#shieldGrad)" 
        stroke="#22593c" 
        stroke-width="10" 
        stroke-linejoin="round"/>

  <!-- Stylized Monogram "T" Stem and Crossbar -->
  <path d="M170 170 H330 V210 H275 V410 H225 V210 H170 V170 Z" 
        fill="#fbfaf7" 
        stroke="#22593c" 
        stroke-width="4"/>

  <!-- Crimson & Forest Tessera Nodes -->
  <circle cx="215" cy="305" r="14" fill="url(#crimsonAccent)"/>
  <circle cx="185" cy="335" r="11" fill="url(#crimsonAccent)"/>
  <circle cx="280" cy="275" r="16" fill="url(#crimsonAccent)"/>
  <circle cx="315" cy="300" r="13" fill="url(#crimsonAccent)"/>

  <line x1="215" y1="305" x2="280" y2="275" stroke="#cf2224" stroke-width="5" stroke-linecap="round"/>
  <line x1="215" y1="305" x2="185" y2="335" stroke="#cf2224" stroke-width="4" stroke-linecap="round"/>
  <line x1="280" y1="275" x2="315" y2="300" stroke="#cf2224" stroke-width="4" stroke-linecap="round"/>

  <circle cx="195" cy="265" r="12" fill="url(#greenNodeGrad)"/>
  <circle cx="285" cy="345" r="11" fill="url(#greenNodeGrad)"/>
</svg>
